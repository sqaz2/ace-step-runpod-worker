name: Build BYOB production image

on:
  workflow_dispatch:
  push:
    branches: [byob-lego]
    paths:
      - .github/workflows/build-byob.yml
      - Dockerfile.base
      - bake_acestep_base.py
      - handler.py
      - gate.py
      - dereverb.py
      - layers.py
      - tune.py
      - instrumental.py
      - check_imports.py
      - tests/**

permissions:
  contents: read
  packages: write

concurrency:
  group: byob-production-image
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      IMAGE: ghcr.io/sqaz2/ace-step-runpod-worker
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Make room on the disposable runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          df -h /
      - name: Authenticate to the repository's container registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Build the base-model worker and its baked model checks
        run: |
          docker build --pull --file Dockerfile.base \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$IMAGE:base-v4-$GITHUB_SHA" .
      - name: Run the CPU quality regressions inside the production image
        run: |
          docker run --rm --entrypoint python \
            --mount "type=bind,src=$GITHUB_WORKSPACE/tests,dst=/app/tests,readonly" \
            "$IMAGE:base-v4-$GITHUB_SHA" -m unittest discover -s /app/tests -v
      - name: Publish the verified image
        run: |
          docker push "$IMAGE:base-v4-$GITHUB_SHA"
          docker tag "$IMAGE:base-v4-$GITHUB_SHA" "$IMAGE:base-v4"
          docker push "$IMAGE:base-v4"
          printf 'Image: `%s:base-v4-%s`\n' "$IMAGE" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          docker inspect --format '{{json .RepoDigests}}' "$IMAGE:base-v4-$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove runner registry credentials
        if: always()
        run: docker logout ghcr.io
